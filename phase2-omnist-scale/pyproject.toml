[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnist-scale"
version = "0.1.0"
description = "Scalable, certified topology-invariant spatiotemporal forecasting: sub-quadratic attention + SSM temporal backbone + distribution-free coverage at scale"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Praveg Vashishtha" }]
license = { text = "MIT" }
keywords = [
    "spatiotemporal forecasting", "conformal prediction", "state space models",
    "scalable attention", "topology invariance", "trustworthy ml",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]                  # backbone + SSM block (MPS)
dev = ["pytest>=8.0", "ruff>=0.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
